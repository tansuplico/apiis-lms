<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APIIS Learning Management System</title>
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #app-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .app-loader-card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
        padding: 32px 44px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .app-loader-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e5e7eb;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .app-loader-text {
        color: #374151;
        font-size: 14px;
        font-weight: 500;
        font-family: sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #app-loader {
          background: rgba(17, 24, 39, 0.7);
        }
        .app-loader-card {
          background: #1f2937;
        }
        .app-loader-text {
          color: #d1d5db;
        }
      }
    </style>
  </head>

  <body>
    <div id="app-loader">
      <div class="app-loader-card">
        <div class="app-loader-spinner"></div>
        <p class="app-loader-text">Refetching...</p>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
