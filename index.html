<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APIIS Learning Management System</title>
    <style>
      /* Startup splash: shown before React loads, updated by
         src/utils/bootSplash.ts, removed once startup is done. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        transition: opacity 0.25s ease;
      }
      #boot-splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      .boot-column {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: boot-in 0.2s ease-out both;
      }
      .boot-logo {
        width: 180px;
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
      }
      .boot-sub {
        margin: 10px 0 28px;
        color: #64748b;
        font-size: 14px;
        letter-spacing: 0.02em;
      }
      .boot-track {
        position: relative;
        width: 160px;
        height: 4px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
      }
      .boot-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #0a8bd6, #7cbf1f);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      #boot-status {
        margin: 14px 0 0;
        min-height: 18px;
        color: #475569;
        font-size: 13px;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @keyframes boot-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash {
          background: #030712;
        }
        .boot-sub {
          color: #94a3b8;
        }
        .boot-track {
          background: #1f2937;
        }
        #boot-status {
          color: #cbd5e1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          transition: none;
        }
        .boot-column,
        .boot-bar {
          animation: none;
        }
        .boot-bar {
          left: 30%;
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" role="status">
      <div class="boot-column">
        <img class="boot-logo" src="/src/assets/logo.png" alt="APIIS" />
        <p class="boot-sub">Learning Management System</p>
        <div class="boot-track" aria-hidden="true">
          <div class="boot-bar"></div>
        </div>
        <p id="boot-status" aria-live="polite">Starting up…</p>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
